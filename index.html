<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Hi+Melody&family=Single+Day&family=Gamja+Flower&family=Poor+Story&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&family=Playfair+Display:wght@700&family=Dancing+Script:wght@600&family=Caveat:wght@600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#fffefb; --ink:#2b2622; --muted:#8a8177; --line:#ece6d9;
  --accent:#f7b5cc; --accent-soft:#fdeaf1; --today:#e26d5a;
  --font:"Gaegu"; --font-head:var(--font);
  --fs-base:17px; --fs-bigdate:44px; --fs-title:28px; --fs-item:22px; --fs-event:22px; --fs-cal:12px; --fs-mini:12.5px; --fs-head:13px; --fs-pill:15px; --fs-day:16px; --day-bg:#fcf9f9; --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d1a17; --card:#26221e; --ink:#f0e9de; --muted:#9a9084; --line:#38322b;
    --accent:#f7b5cc; --accent-soft:#3d2630; --today:#ee7f6c; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs-base)/1.4 var(--font),system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.ev,.tcol div,.week-head div,.mini-grid,.tag,.item .t{font-weight:700}

.app{height:100vh;height:100dvh;padding:14px;display:grid;gap:14px;
  grid-template-columns:minmax(260px,300px) 1fr minmax(260px,320px);
  grid-template-rows:minmax(200px,230px) 1fr;
  grid-template-areas:"head mtodo mini" "week week wtodo"}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:0;min-width:0}

/* header */
.head{grid-area:head;display:flex;flex-direction:column;justify-content:space-between;padding:6px 4px 0}
.bigdate{font-family:var(--font-head);font-size:var(--fs-bigdate);font-weight:700;letter-spacing:-.02em;line-height:1.05;text-align:left;padding:0}
.subline{display:flex;align-items:center;gap:12px;margin-top:4px}
.subline #dow{font-size:calc(var(--fs-bigdate) * .5);font-weight:500;color:var(--muted);line-height:1.2}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{padding:8px 0;border-radius:10px;font-size:var(--fs-head);color:var(--muted);border:1px solid transparent;transition:.15s}
.months button:hover{background:var(--accent-soft);color:var(--ink)}
.months button.on{background:var(--accent);color:#4a2236;font-weight:700}
.tools{display:flex;gap:10px;align-items:center;font-size:calc(var(--fs-head) - 1px);color:var(--muted);margin-top:8px}
.tools button{text-decoration:underline;text-underline-offset:2px;color:var(--muted)}

/* todo card */
.todo{display:flex;flex-direction:column;padding:12px 14px}
.todo h2{font-family:var(--font-head);font-size:var(--fs-title);line-height:1.15;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.todo h2 span{font-weight:500;color:var(--muted);font-size:calc(var(--fs-title) * .64)}
.add{display:flex;gap:6px;margin:8px 0 6px}
.add input{font-size:var(--fs-item);flex:1;min-width:0;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;outline:none}
.add input:focus{border-color:var(--accent)}
.add button{width:34px;border-radius:10px;background:var(--accent);color:#4a2236;font-weight:700;font-size:18px;line-height:1}
.list{list-style:none;padding:0;flex:1;min-height:40px;overflow-y:auto;scrollbar-width:none;align-content:start}
.list::-webkit-scrollbar{display:none}
.list:empty::before{content:"All done ✓";display:block;color:var(--muted);font-size:13px;padding:8px 2px}
#monthList{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;grid-auto-rows:34px;overflow-y:auto}
.item{display:flex;align-items:center;gap:9px;padding:0 4px;min-height:34px;border-radius:8px;transition:opacity .3s,transform .3s,background .15s;cursor:grab}
.item:hover{background:var(--accent-soft)}
.item .chk{appearance:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;flex:none;cursor:pointer;transition:.15s;display:grid;place-content:center}
.item .chk:hover{border-color:var(--accent)}
.item .chk:checked{background:var(--accent);border-color:var(--accent)}
.item .chk:checked::after{content:"✓";font-size:11px;color:#4a2236;font-weight:700}
.item{font-size:var(--fs-item);line-height:1.2}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{opacity:0;color:var(--muted);font-size:16px;padding:0 4px}
.item:hover .x{opacity:1}
.item.fade{opacity:0;transform:translateX(14px)}
.sortable-ghost{opacity:.35;background:var(--accent-soft)}
.sortable-chosen{box-shadow:var(--shadow);background:var(--card)}

/* mini calendar */
.mini{grid-area:mini;padding:10px 12px;display:flex;flex-direction:column}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mini-head b{font-size:calc(var(--fs-mini) * 1.2)}.mini-head b span{color:var(--muted);font-weight:500;margin-left:6px;font-size:calc(var(--fs-mini) * .95)}
.mini-head button{width:30px;height:30px;border-radius:50%;font-size:16px;color:var(--muted)}
.mini-head button:hover{background:var(--accent-soft);color:var(--ink)}
.mini-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;text-align:center;font-size:var(--fs-mini);min-height:0}
.mini-grid .dow{color:var(--muted);font-size:calc(var(--fs-mini) * .88);align-self:center}
.mini-grid button{position:relative;border-radius:8px;color:var(--ink)}
.mini-grid button.out{color:var(--muted);opacity:.5}
.mini-grid button.inweek{background:var(--accent-soft)}
.mini-grid button:hover{outline:1px solid var(--accent)}
.mini-grid .sun{color:#e5534b}.mini-grid .sat{color:#4fa3e0}
.mini-grid button.today{background:var(--accent);color:#4a2236;font-weight:800;border-radius:99px}
.mini-grid button.has::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}

/* weekly calendar */
.week{grid-area:week;display:flex;flex-direction:column;overflow:hidden;--hh:60px}
.week-head{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--line);flex:none}
.week-head div{padding:8px 0 6px;text-align:center;font-size:var(--fs-cal);color:var(--muted);border-left:1px solid var(--line)}
.week-head div:first-child{border:0}
.week-head{position:relative}
.week-head>div:not(:first-child){cursor:pointer;transition:background .15s}
.week-head>div:not(:first-child):hover{background:var(--accent-soft)}
.daystrip{display:grid;grid-template-columns:52px repeat(7,1fr);flex:0 1 auto;min-height:0;max-height:calc(var(--hh) * 8);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--day-bg);
  --ink:#2b2622;--muted:#8a8177;--line:#e9e2e0}   /* keep text readable on this light panel even in dark mode */
.daystrip[hidden]{display:none}
.daystrip::-webkit-scrollbar{display:none}
.dcell{border-left:1px solid var(--line);padding:4px 6px 4px 8px;min-width:0}   /* the strip grows with the longest day (up to 8 rows, then scrolls) */
.dcell.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.dlist{list-style:none;padding:0;min-height:100%}
.dcell .item{font-size:var(--fs-day);min-height:28px;gap:7px;padding:0 2px}
.dcell .item .chk{width:16px;height:16px;border-width:2px}
.dcell .item .chk:checked::after{font-size:10px}
.dcell .item .pill{font-size:calc(var(--fs-day) * .8);padding:3px 8px}
.dtool{display:flex;justify-content:center;padding-top:6px}
.dtool .ddone{width:34px;height:26px;border-radius:99px;border:1px solid var(--line);font-size:15px;font-weight:700;color:var(--muted);transition:.15s}
.dtool .ddone:hover{color:var(--ink);background:var(--accent-soft)}
.dtool .ddone.on{background:var(--accent);border-color:var(--accent);color:#4a2236}
.dcell .ddn{list-style:none;padding:2px 0 0;margin-top:3px;border-top:1px dashed var(--line)}
.dcell .item{align-items:flex-start;padding:3px 2px}
.dcell .item .sp,.dcell .item .pill{display:none}   /* tags stay on the task (type #tag, or edit it) but are not shown in the narrow day columns */
.dcell .item .t{flex:1 1 0;min-width:0;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.25;padding-top:1px}   /* long text wraps, hanging-indented next to the checkbox */
.dcell .item .chk{margin-top:3px}
.dcell .item{position:relative}
.dcell .item .x{position:absolute;right:0;top:2px;padding:0 5px;border-radius:8px;background:var(--card);line-height:1.4}   /* floats over the text on hover so it does not eat width */
.dcell .item .edit{padding:2px 6px}
.dadd{display:flex;align-items:center;gap:7px;min-height:28px;padding:0 2px;font-size:var(--fs-day)}
.dadd .fchk{flex:none;width:16px;height:16px;border:2px solid var(--muted);border-radius:50%;opacity:.28}
.dadd input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;color:var(--ink);padding:3px 0}
.dadd input::placeholder{color:var(--muted);opacity:.5}
.dadd:focus-within .fchk{opacity:.7;border-color:var(--accent)}
.wnav{width:34px;height:34px;border-radius:50%;font-size:26px;line-height:1;color:var(--muted);transition:.15s}
.wnav:hover{background:var(--accent-soft);color:var(--ink)}
.week-head div:first-child .wnav{margin:0 auto;display:block;padding-bottom:3px}
.wnav.r{position:absolute;right:6px;top:8px}
.week-head b{display:block;font-size:calc(var(--fs-cal) * 1.5);color:var(--ink);font-weight:600}
.week-head .sun,.week-head .sun b{color:#e5534b}
.week-head .sat,.week-head .sat b{color:#4fa3e0}
.week-head .today{color:var(--ink)}
.week-head .today b{width:fit-content;margin:0 auto;min-width:1.7em;padding:0 .35em;border-radius:99px;background:var(--accent);color:#4a2236}
.week-body{flex:1;min-height:calc(var(--hh) * 3);overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:52px repeat(7,1fr);position:relative}
.week-body::-webkit-scrollbar{display:none}
.tcol div{height:var(--hh);font-size:calc(var(--fs-cal) * .92);color:var(--muted);text-align:right;padding:3px 8px 0 0}
.day{position:relative;border-left:1px solid var(--line)}
.day.today{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.slot{height:var(--hh);border-top:1px solid var(--line);cursor:pointer}
.slot:hover{background:var(--accent-soft)}
.ev{position:absolute;border-radius:7px;padding:2px 6px;font-size:var(--fs-event);line-height:1.1;overflow:hidden;cursor:grab;min-height:10px;touch-action:none;user-select:none;
  background:color-mix(in srgb,var(--c) 50%,var(--card));border-left:4px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 1px var(--card)}
.ev.dragging{cursor:grabbing;z-index:50!important;box-shadow:0 6px 18px rgba(0,0,0,.28);opacity:.92}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev i{font-style:normal;color:var(--muted);font-size:calc(var(--fs-event) * .72)}
.ev .tg{font-size:calc(var(--fs-event) * .68);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .rz{position:absolute;left:0;right:0;height:6px;cursor:ns-resize}
.ev .rz.t{top:0}.ev .rz.b{bottom:0}
.ev:hover .rz::after{content:"";position:absolute;left:50%;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--c);opacity:.7}
.ev .rz.t::after{top:1px}.ev .rz.b::after{bottom:1px}
.todo .tsort,.todo .ddone{margin-left:6px;padding:2px 9px;flex:none;border-radius:99px;border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);transition:.15s}
.todo .tsort:hover,.todo .ddone:hover{color:var(--ink);background:var(--accent-soft)}
.todo .tsort.on,.todo .ddone.on{background:var(--accent);border-color:var(--accent);color:#4a2236}
.todo h2{white-space:nowrap}
.donebox{flex:none;max-height:42%;overflow-y:auto;scrollbar-width:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.donebox::-webkit-scrollbar{display:none}
.donebox[hidden]{display:none}
.donebox h5{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.donebox .none{font-size:15px;color:var(--muted);padding:4px 2px}
.donebox .dl{list-style:none;padding:0}
#mDone .dl{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item.done .pill{opacity:.65}
.trow{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.trow h2{flex:none}
.trow .add{flex:1;min-width:0;margin:0}
.trow .tsort,.trow .ddone{margin:0}
.todo h2 span{display:flex;align-items:center;min-width:0;font-size:calc(var(--fs-title) * .54)}
.todo h2 i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tagbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 6px;padding:2px 0;flex:none}
.tagbar::-webkit-scrollbar{display:none}
.tagbar[hidden]{display:none}
.tagbar .pill{flex:none;font-size:var(--fs-pill);font-weight:700;line-height:1;padding:5px 11px;border-radius:99px;cursor:grab;white-space:nowrap;user-select:none;
  background:color-mix(in srgb,var(--c) 60%,var(--card));color:color-mix(in srgb,var(--c) 22%,var(--ink))}
.tagbar .pill.sortable-chosen{box-shadow:var(--shadow)}
.tagbar:empty::before{content:"No tags yet — add one with #tag";font-size:14px;color:var(--muted)}
.todaybtn{height:28px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:15px;font-weight:700;color:var(--ink);background:var(--card);transition:.15s}
.todaybtn:hover{background:var(--accent);border-color:var(--accent);color:#4a2236}
.item .t{flex:0 1 auto}
.item.overdue .t{color:var(--today)}
.item.overdue .chk{border-color:var(--today)}
.item .sp{flex:1}
.item .pill{flex:none;font-size:var(--fs-pill);font-weight:700;line-height:1;padding:4px 10px;border-radius:99px;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 60%,var(--card));color:color-mix(in srgb,var(--c) 22%,var(--ink))}
.item .pill.late{background:var(--c);color:#fff}
.item.editing .pill,.item.editing .sp{display:none}
.item .edit{flex:1;min-width:0;padding:4px 8px;border-radius:8px;border:1px solid var(--accent);background:var(--card);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--today);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--today)}

.wtodo{grid-area:wtodo}

/* dialog */
dialog{margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);padding:0;width:min(440px,92vw);max-height:92vh;overflow:auto;
  box-shadow:0 30px 80px rgba(30,20,5,.35),0 2px 6px rgba(30,20,5,.12);--c:var(--accent)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
dialog[open]::backdrop{animation:fade .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes fade{from{opacity:0}}
dialog::backdrop{background:rgba(30,20,5,.4);backdrop-filter:blur(4px)}
.dlg-bar{height:6px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 45%,var(--card)))}
#evForm{padding:22px 26px 24px}
.dlg-kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
dialog input.title{width:100%;font-size:22px;font-weight:700;letter-spacing:-.01em;padding:6px 0 8px;margin:4px 0 6px;border:0;border-bottom:2px solid var(--line);background:transparent;outline:none;transition:border-color .15s}
dialog input.title:focus{border-color:var(--c)}
dialog label.l{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px}
dialog input[type=date],dialog input[type=time],dialog input.tagin{width:100%;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 4%,transparent);outline:none;transition:.15s}
dialog input[type=date]:focus,dialog input[type=time]:focus,dialog input.tagin:focus{border-color:var(--c);background:transparent;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.row{display:flex;gap:10px}.row>div{flex:1}
.colors{display:grid;grid-template-columns:repeat(9,1fr);gap:8px 6px}
.colors label{margin:0;cursor:pointer;display:block}
.colors input[type=radio]{display:none}
.colors .pick{position:relative}
.colors .pick span{background:conic-gradient(#f9b4b4,#fcd5a5,#fbe7a1,#b5e5bb,#a5e1e8,#a8d5f5,#c3bff3,#efbde0,#f9b4b4)}
.colors span{display:block;aspect-ratio:1;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .12s}
.colors label:hover span{transform:scale(1.12)}
.colors input:checked+span{box-shadow:0 0 0 2px var(--c);transform:scale(1.08)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tags:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);color:var(--muted);transition:.12s;cursor:pointer}
.tag:hover{border-color:var(--c);color:var(--ink)}
.tag.on{background:var(--c);border-color:var(--c);color:#4a2236;font-weight:700}
.tag u{text-decoration:none;opacity:0;margin-left:2px;font-size:13px;line-height:1}
.tag:hover u{opacity:.7}.tag u:hover{opacity:1}
.btns{display:flex;gap:8px;margin-top:24px;justify-content:flex-end}
.btns button{padding:9px 18px;border-radius:11px;border:1px solid var(--line);transition:.15s}
.btns button:hover{background:var(--accent-soft)}
.btns .pri{background:var(--c);border-color:var(--c);color:#4a2236;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.btns .pri:hover{background:var(--c);filter:brightness(1.07)}
.btns .del{margin-right:auto;color:var(--today);border-color:transparent}

.ac{position:fixed;z-index:60;min-width:160px;max-height:220px;overflow:auto;padding:5px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  box-shadow:0 12px 32px rgba(30,20,5,.2);font-size:18px}
.ac[hidden]{display:none}
.ac div{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:9px;cursor:pointer;font-weight:700}
.ac div::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.ac div.on,.ac div:hover{background:var(--accent-soft)}
.ac small{margin-left:auto;padding-left:14px;font-size:12px;color:var(--muted);font-weight:400}
.tools #gear{text-decoration:none;font-size:22px;line-height:1;width:30px;height:30px;border-radius:50%;color:var(--muted);transition:.2s}
.tools #gear:hover{background:var(--accent-soft);color:var(--ink);transform:rotate(60deg)}
.settings{position:fixed;top:12px;right:12px;bottom:12px;width:min(340px,92vw);z-index:45;display:flex;flex-direction:column;border-radius:20px;
  background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 24px 60px rgba(30,20,5,.28);font:15px/1.35 var(--font),system-ui,sans-serif;animation:slidein .22s cubic-bezier(.2,.9,.3,1)}
.settings[hidden]{display:none}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
.settings header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.settings header b{font-size:20px}
.settings header button{width:30px;height:30px;border-radius:50%;font-size:20px;color:var(--muted)}
.settings header button:hover{background:var(--accent-soft);color:var(--ink)}
.settings .body{flex:1;overflow-y:auto;padding:4px 18px 10px}
.settings h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.settings .row2{display:flex;align-items:center;gap:10px;margin:7px 0}
.settings .row2 label{flex:0 0 118px;font-size:14px}
.settings .row2 output{flex:0 0 34px;text-align:right;font-size:13px;color:var(--muted)}
.settings input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.settings input[type=color]{width:40px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.settings select{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.settings .upl{margin-top:2px}
.settings .upl button{white-space:nowrap;flex:none;padding:6px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:700}
.settings .upl button:hover{background:var(--accent-soft)}
.settings .hint{font-size:12px;color:var(--muted)}
.settings .myfont{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;padding:4px 6px 4px 12px;border-radius:10px;background:var(--accent-soft);font-size:17px}
.settings .myfont span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings .myfont button{width:24px;height:24px;border-radius:50%;color:var(--muted)}
.settings .myfont button:hover{background:var(--card);color:var(--today)}
.settings .sample{margin:2px 0 4px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);font-size:20px}
.settings .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.settings .presets button{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 6px;border-radius:99px;border:1px solid var(--line);font-size:14px}
.settings .presets button:hover{background:var(--accent-soft)}
.settings .presets i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.settings .swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:4px 0 8px}
.settings .swatches button{aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 1px var(--line);transition:transform .1s}
.settings .swatches button:hover{transform:scale(1.18)}
.settings footer{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.settings footer button{padding:6px 14px;border-radius:10px;border:1px solid var(--line);color:var(--today);font-size:14px}
.settings footer button:hover{background:var(--accent-soft)}

.cpop{position:fixed;z-index:70;padding:8px 10px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 32px rgba(30,20,5,.25);animation:pop .14s ease}
.cpop[hidden]{display:none}
.cpop .pickc{position:relative;width:24px;height:24px;border-radius:50%;cursor:pointer;overflow:hidden;box-shadow:0 0 0 1px var(--line);
  background:conic-gradient(#f9b4b4,#fcd5a5,#fbe7a1,#b5e5bb,#a5e1e8,#a8d5f5,#c3bff3,#efbde0,#f9b4b4)}
.cpop .pickc input,.colors .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;display:block;padding:0;border:0}
.cpop .cmore{margin:8px 0 0;text-align:right}
.cpop .cedit,.colors .cedit,.colors .crestore{white-space:nowrap;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.cpop .cedit:hover,.colors .cedit:hover,.colors .crestore:hover{color:var(--ink)}
.cpop.editing button[data-c]{position:relative}
.cpop.editing button[data-c]::after{content:"×";position:absolute;inset:0;display:grid;place-content:center;font-size:16px;font-weight:700;color:#4a2236;background:rgba(255,255,255,.45);border-radius:50%}
.colors .cbar{grid-column:1/-1;display:flex;gap:14px;margin-top:2px}
.colors label{position:relative}
.colors .cdel{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--card);font-size:12px;line-height:16px;display:grid;place-content:center;z-index:2}
.colors [data-sw]{cursor:grab}
.colors .sortable-chosen span{transform:scale(1.18);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.colors .sortable-ghost{opacity:.4}
.cpop [data-sw]{cursor:grab}
.cpop .sortable-ghost{opacity:.4}
.cpop small{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}
.cpop div{display:grid;grid-template-columns:repeat(7,24px);gap:7px}
.cpop div button{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line);transition:transform .1s}
.cpop div button:hover{transform:scale(1.15)}
.cpop div button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.item .pill{cursor:pointer}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{margin-left:12px;text-decoration:underline;font-weight:700}

/* narrow screens: stack */
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"head" "mini" "mtodo" "week" "wtodo"}
  .week{height:75vh}.mini{min-height:300px}.wtodo{min-height:260px}
  #monthList{max-height:220px}
}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <button class="bigdate" id="bigdate" title="Go to today"></button>
      <div class="subline"><span id="dow"></span><button id="todayBtn" class="todaybtn" title="Back to today">Today</button></div>
    </div>
    <div>
      <div class="months" id="months"></div>
      <div class="tools"><button id="gear" title="Settings" aria-label="Settings">⚙</button><button id="exp">Backup</button><button id="imp">Restore</button><input type="file" id="file" accept="application/json" hidden></div>
    </div>
  </header>

  <section class="card todo" style="grid-area:mtodo">
    <div class="trow">
      <h2>Monthly To-do</h2>
      <form class="add" id="mAdd"><input placeholder="Add a monthly to-do…" autocomplete="off"><button aria-label="Add">+</button></form>
      <button class="tsort" data-s="month" title="Group by tag · drag tags to set the order">#</button>
      <button class="ddone" data-d="month" title="Show completed">✓</button>
    </div>
    <div class="tagbar" id="mBar" hidden></div>
    <ul class="list" id="monthList"></ul>
    <div class="donebox" id="mDone" hidden></div>
  </section>

  <section class="card mini">
    <div class="mini-head"><button id="prev" aria-label="Previous month">‹</button><b id="miniTitle"></b><button id="next" aria-label="Next month">›</button></div>
    <div class="mini-grid" id="miniGrid"></div>
  </section>

  <section class="card week" id="week">
    <div class="week-head" id="weekHead"></div>
    <div class="daystrip" id="dayStrip" hidden></div>
    <div class="week-body" id="weekBody"></div>
  </section>

  <section class="card todo wtodo">
    <h2>Weekly To-do <span><button class="tsort" data-s="week" title="Group by tag · drag tags to set the order">#</button><button class="ddone" data-d="week" title="Show completed">✓</button></span></h2>
    <form class="add" id="wAdd"><input placeholder="Add a weekly to-do…" autocomplete="off"><button aria-label="Add">+</button></form>
    <div class="tagbar" id="wBar" hidden></div>
    <ul class="list" id="weekList"></ul>
    <div class="donebox" id="wDone" hidden></div>
  </section>
</div>

<dialog id="dlg">
  <div class="dlg-bar"></div>
  <form method="dialog" id="evForm">
    <div class="dlg-kicker" id="dlgTitle">New event</div>
    <input type="text" class="title" id="fTitle" required autocomplete="off" placeholder="Event title">
    <label class="l">Date</label><input type="date" id="fDate" required>
    <div class="row"><div><label class="l">Start</label><input type="time" id="fStart" step="900" required></div><div><label class="l">End</label><input type="time" id="fEnd" step="900" required></div></div>
    <label class="l">Color</label><div class="colors" id="fColors"></div>
    <label class="l">Tags</label><div class="tags" id="fTags"></div>
    <input type="text" class="tagin" id="fTagNew" autocomplete="off" placeholder="New tag — press Enter to add">
    <div class="btns"><button type="button" class="del" id="fDel">Delete</button><button type="button" id="fCancel">Cancel</button><button class="pri" value="ok">Save</button></div>
  </form>
</dialog>
<aside class="settings" id="settings" hidden aria-label="Settings"></aside>
<div class="toast" id="toast"></div>

<script src="sortable.min.js"></script>
<script>
const KEY='planner-v1', COLORS=['#f7b5cc','#f4a3a3','#fbc79a','#fbe7a1','#d4e8a0','#aee3b8','#a3e0d8','#a8d5f5','#b9b9f2','#d6b8f0','#e3cdb4','#cfd4da'];
const PASTEL_NAMES=['Pink','Coral','Orange','Yellow','Lime','Green','Teal','Sky','Periwinkle','Purple','Beige','Gray'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['S','M','T','W','T','F','S'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wkStart=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-d.getDay());
const mKey=(y,m)=>`${y}-${pad(m+1)}`;
const toH=t=>{const [h,m]=t.split(':').map(Number);return h+m/60};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let db={events:[],todos:[],tags:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.events&&s.todos)db=s}catch(e){}
db.tags=db.tags||[];db.tagSort=db.tagSort||{};db.tagColors=db.tagColors||{};db.customColors=db.customColors||[];db.hiddenColors=db.hiddenColors||[];db.paletteOrder=db.paletteOrder||[];db.showDone=db.showDone||{};
const normSettings=()=>{const o=db.settings=db.settings||{};o.sizes=o.sizes||{};o.colors=o.colors||{}};normSettings();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};

const today=new Date();
const view={y:today.getFullYear(),m:today.getMonth(),ws:wkStart(today)};

/* ---- navigation ---- */
function gotoMonth(y,m){
  view.y=y;view.m=m;
  view.ws=wkStart(new Date(y,m,1));   // first week of that month
  renderAll();scrollToDefault();
}
function gotoDate(d){view.ws=wkStart(d);renderAll(true);scrollToDefault()}   // navigating always resets to the start hour
function shiftMonth(n){const d=new Date(view.y,view.m+n,1);gotoMonth(d.getFullYear(),d.getMonth())}

/* ---- header ---- */
function renderHead(){
  $('#bigdate').textContent=`${today.getDate()} ${FULL[today.getMonth()]}`;
  $('#dow').textContent=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][today.getDay()];
  $('#months').innerHTML=MON.map((n,i)=>`<button data-m="${i}" class="${i===view.m?'on':''}">${n}</button>`).join('');
}
$('#months').onclick=e=>{const b=e.target.closest('button');if(b)gotoMonth(view.y,+b.dataset.m)};
const goToday=()=>{today.setTime(Date.now());view.y=today.getFullYear();view.m=today.getMonth();view.ws=wkStart(today);renderAll();scrollToDefault()};
$('#bigdate').onclick=goToday;
$('#todayBtn').onclick=goToday;
$('#prev').onclick=()=>shiftMonth(-1);
$('#next').onclick=()=>shiftMonth(1);

/* ---- mini calendar ---- */
function renderMini(){
  $('#miniTitle').innerHTML=`${FULL[view.m]}<span>${view.y}</span>`;
  const first=new Date(view.y,view.m,1), start=wkStart(first);
  const weeks=Math.ceil((first.getDay()+new Date(view.y,view.m+1,0).getDate())/7);
  const evDays=new Set(db.events.map(e=>e.date));
  const wsISO=iso(view.ws), weISO=iso(addDays(view.ws,6)), tISO=iso(today);
  let h=DOW.map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), s=iso(d);
    const cls=[d.getDay()===0?'sun':d.getDay()===6?'sat':'',d.getMonth()!==view.m?'out':'',s>=wsISO&&s<=weISO?'inweek':'',s===tISO?'today':'',evDays.has(s)?'has':''].join(' ');
    h+=`<button class="${cls}" data-d="${s}">${d.getDate()}</button>`;
  }
  $('#miniGrid').style.gridTemplateRows=`auto repeat(${weeks},1fr)`;
  $('#miniGrid').innerHTML=h;
}
// click = jump to that week, double-click = add an event on that date (grid re-renders, so detect manually)
let lastMini={d:'',t:0};
$('#miniGrid').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset.d,now=Date.now(),dbl=d===lastMini.d&&now-lastMini.t<400;
  lastMini={d,t:dbl?0:now};
  if(dbl)openDlg(null,{date:d,start:'06:00',end:'07:00'});else gotoDate(parse(d));
};

/* ---- weekly calendar ---- */
function setHourHeight(){
  const body=$('#weekBody'), old=hourH();
  const strip=$('#dayStrip'),hh=Math.max(22,(body.clientHeight+(strip.hidden?0:strip.offsetHeight))/(db.settings.hours||10));  // 10 hours visible by default
  $('#week').style.setProperty('--hh',hh+'px');
  body.scrollTop=body.scrollTop/old*hh;        // keep the same top hour on resize
}
const hourH=()=>parseFloat(getComputedStyle($('#week')).getPropertyValue('--hh'));
function scrollToDefault(){const b=$('#weekBody');b.scrollTop=(db.settings.startHour??8)*hourH()}
function layout(list){
  list.sort((a,b)=>a.s-b.s||b.e-a.e);
  let cl=[],end=0;
  const flush=()=>{const lanes=[];cl.forEach(o=>{let i=lanes.findIndex(x=>x<=o.s);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=o.e;o.lane=i});cl.forEach(o=>o.n=lanes.length)};
  list.forEach(o=>{if(cl.length&&o.s>=end){flush();cl=[];end=0}cl.push(o);end=Math.max(end,o.e)});
  if(cl.length)flush();
  list.forEach((o,i)=>o.z=i+1);   // later events sit in front
  return list;
}
const fmt=h=>h>=24?'23:59':`${pad(Math.floor(h))}:${pad(Math.round((h%1)*60))}`;
function renderWeek(){
  const body=$('#weekBody'), keep=body.scrollTop, tISO=iso(today);
  const days=[...Array(7)].map((_,i)=>addDays(view.ws,i));
  $('#weekHead').innerHTML='<div><button class="wnav" data-n="-1" aria-label="Previous week">‹</button></div>'
    +days.map(d=>`<div class="${iso(d)===tISO?'today':''} ${d.getDay()===0?'sun':d.getDay()===6?'sat':''}">${DOW[d.getDay()]}<b>${d.getDate()}</b></div>`).join('')
    +'<button class="wnav r" data-n="1" aria-label="Next week">›</button>';
  let h='<div class="tcol">'+[...Array(24)].map((_,i)=>`<div>${pad(i)}:00</div>`).join('')+'</div>';
  const nowH=today.getHours()+today.getMinutes()/60;
  days.forEach(d=>{
    const s=iso(d);
    const evs=layout(db.events.filter(e=>e.date===s).map(ev=>{const st=toH(ev.start);return{ev,s:st,e:Math.max(toH(ev.end),st+.25)}}));
    h+=`<div class="day ${s===tISO?'today':''}" data-d="${s}">`+[...Array(24)].map((_,i)=>`<div class="slot" data-h="${i}"></div>`).join('')
      +evs.map(o=>`<div class="ev" data-id="${o.ev.id}" style="--c:${o.ev.color};top:calc(var(--hh)*${o.s});height:calc(var(--hh)*${o.e-o.s} - 2px);left:${2+Math.min(o.lane,5)*12}px;right:2px;z-index:${o.z}" title="Drag to move · drag edges to resize · double-click to edit"><div class="rz t"></div><b>${esc(o.ev.title)}</b><i>${o.ev.start}–${o.ev.end}</i>${(o.ev.tags||[]).length?`<div class="tg">${o.ev.tags.map(t=>'#'+esc(t)).join(' ')}</div>`:''}<div class="rz b"></div></div>`).join('')
      +(s===tISO?`<div class="now" style="top:calc(var(--hh)*${nowH})"></div>`:'')+'</div>';
  });
  body.innerHTML=h;
  body.scrollTop=keep;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#weekHead').onclick=e=>{
  const b=e.target.closest('.wnav'),c=e.target.closest('.week-head>div');
  if(b)gotoDate(addDays(view.ws,7*b.dataset.n));
  else if(c&&c!==$('#weekHead').firstElementChild){db.dayOpen=!db.dayOpen;save();renderDays()}   // click any date: show / hide the week's daily to-dos
};
$('#weekBody').onclick=e=>{
  const slot=e.target.closest('.slot');
  if(slot){const date=slot.parentNode.dataset.d,h=+slot.dataset.h;
    openDlg(null,{date,start:`${pad(h)}:00`,end:`${pad(Math.min(h+1,23))}:${h>=23?'59':'00'}`})}
};
$('#weekBody').ondblclick=e=>{
  const ev=e.target.closest('.ev');
  if(ev)openDlg(db.events.find(x=>x.id===ev.dataset.id));
};

/* drag to move / resize events (15-min snap) */
let drag=null;
$('#weekBody').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.ev');if(!el||e.button)return;
  const ev=db.events.find(x=>x.id===el.dataset.id);if(!ev)return;
  const cols=[...document.querySelectorAll('#weekBody .day')];
  drag={el,ev,id:e.pointerId,x0:e.clientX,y0:e.clientY,hh:hourH(),cols,moved:false,
    mode:e.target.classList.contains('rz')?(e.target.classList.contains('t')?'top':'bot'):'move',
    s:toH(ev.start),e:Math.max(toH(ev.end),toH(ev.start)+.25),date:ev.date,
    col0:cols.findIndex(c=>c.dataset.d===ev.date)};
  drag.ns=drag.s;drag.ne=drag.e;drag.col=drag.col0;
  el.setPointerCapture(e.pointerId);
});
$('#weekBody').addEventListener('pointermove',e=>{
  const d=drag;if(!d||e.pointerId!==d.id)return;
  if(!d.moved){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<4)return;d.moved=true;d.el.classList.add('dragging')}
  const dh=Math.round((e.clientY-d.y0)/d.hh*4)/4, dur=d.e-d.s;
  if(d.mode==='move'){
    d.ns=Math.min(Math.max(d.s+dh,0),24-dur);d.ne=d.ns+dur;
    const i=d.cols.findIndex(c=>{const r=c.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<r.right});
    if(i>=0)d.col=i;
    d.el.style.transform=`translateX(${d.cols[d.col].getBoundingClientRect().left-d.cols[d.col0].getBoundingClientRect().left}px)`;
  }else if(d.mode==='top'){d.ns=Math.min(Math.max(d.s+dh,0),d.e-.25);d.ne=d.e}
  else{d.ns=d.s;d.ne=Math.min(Math.max(d.e+dh,d.s+.25),24)}
  d.el.style.top=`calc(var(--hh)*${d.ns})`;
  d.el.style.height=`calc(var(--hh)*${d.ne-d.ns} - 2px)`;
  d.el.querySelector('i').textContent=`${fmt(d.ns)}–${fmt(d.ne)}`;
});
const endDrag=e=>{
  const d=drag;if(!d||e.pointerId!==d.id)return;drag=null;
  if(!d.moved)return;   // plain click: don't re-render, or double-click-to-edit breaks
  if(e.type==='pointercancel')return renderWeek();
  Object.assign(d.ev,{start:fmt(d.ns),end:fmt(d.ne),date:d.cols[d.col].dataset.d});
  save();renderAll(true);
};
$('#weekBody').addEventListener('pointerup',endDrag);
$('#weekBody').addEventListener('pointercancel',endDrag);

/* ---- event dialog ---- */
let editing=null, selTags=new Set();
/* colour palette: the 12 defaults + every colour you ever picked; unused ones can be deleted */
let colorEdit=false;
const palette=()=>{
  const base=[...COLORS.filter(c=>!db.hiddenColors.includes(c)),...db.customColors],ord=db.paletteOrder||[];
  return [...ord.filter(c=>base.includes(c)),...base.filter(c=>!ord.includes(c))];   // dragged order first, new colours at the end
};
const savePaletteOrder=list=>{db.paletteOrder=list;save()};
const swatchSort=(el,pick)=>Sortable.create(el,{draggable:'[data-sw]',filter:'.cdel,.pick,.pickc,.cbar',preventOnFilter:false,
  animation:220,easing:'cubic-bezier(.2,.8,.2,1)',delay:140,delayOnTouchOnly:true,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',
  onEnd:()=>savePaletteOrder([...el.querySelectorAll('[data-sw]')].map(x=>x.dataset.sw))});
const rememberColor=c=>{
  if(COLORS.includes(c)){db.hiddenColors=db.hiddenColors.filter(x=>x!==c);save();return}   // a deleted default comes back when picked again
  db.customColors=[c,...db.customColors.filter(x=>x!==c)].slice(0,60);save();
};
function deleteColor(c){
  if(palette().length<=1)return toast('Keep at least one colour'),false;
  if(db.customColors.includes(c))db.customColors=db.customColors.filter(x=>x!==c);
  else if(!db.hiddenColors.includes(c))db.hiddenColors.push(c);
  save();return true;
}

const tagColor=t=>db.tagColors[t]||(()=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]})();
function parseTokens(s){
  const tags=[];let due=null,time=null;
  const title=s.replace(/(^|\s)#([^\s#]+)/g,(_,p,t)=>{if(!tags.includes(t))tags.push(t);return p})
    .replace(/(^|\s)d(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?(?=\s|$)/gi,(m0,p,mo,da,hh,mm)=>{
      const x=new Date(today.getFullYear(),mo-1,+da);
      if(x.getMonth()!=mo-1||(hh!=null&&(+hh>23||+mm>59)))return m0;
      due=iso(x);if(hh!=null)time=`${pad(+hh)}:${mm}`;return p})
    .replace(/\s+/g,' ').trim();
  return{title,tags,due,time};
}

function syncDueEvent(t){
  let ev=db.events.find(e=>e.id===t.eventId);
  if(!t.due){db.events=db.events.filter(e=>e!==ev);t.eventId=null;return}
  const st=t.dueTime||'06:00',o={title:t.title,date:t.due,start:st,end:fmt(toH(st)+1),color:tagColor((t.tags||[])[0]||''),tags:[...(t.tags||[])]};

// autocomplete popup for "#" — Tab / Enter accepts, ↑↓ moves, Esc closes
const acBoxes=new Map();
function attachAC(inp){
  const host=inp.closest('dialog')||document.body;
  let box=acBoxes.get(host);
  if(!box){box=document.createElement('div');box.className='ac';box.hidden=true;host.appendChild(box);
    box.onmousedown=e=>e.preventDefault();acBoxes.set(host,box)}
  let items=[],idx=0,from=0;
  const close=()=>{box.hidden=true;items=[]};
  const paint=()=>{box.innerHTML=items.map((t,i)=>`<div class="${i===idx?'on':''}" data-i="${i}" style="--c:${tagColor(t)}">#${esc(t)}</div>`).join('')};
  const accept=i=>{
    const pos=inp.selectionStart,v=inp.value;
    inp.value=v.slice(0,from)+'#'+items[i]+' '+v.slice(pos);
    inp.setSelectionRange(from+items[i].length+2,from+items[i].length+2);close();
  };
  const update=()=>{
    const pos=inp.selectionStart,m=/(^|\s)#([^\s#]*)$/.exec(inp.value.slice(0,pos));
    if(!m)return close();
    const q=m[2].toLowerCase();from=pos-q.length-1;
    items=db.tags.filter(t=>t.toLowerCase().includes(q)&&t.toLowerCase()!==q)
      .sort((a,b)=>b.toLowerCase().startsWith(q)-a.toLowerCase().startsWith(q));
    if(!items.length)return close();
    idx=0;paint();
    const r=inp.getBoundingClientRect();box.style.left=r.left+'px';box.style.top=r.bottom+4+'px';box.hidden=false;
  };
  inp.addEventListener('input',update);
  inp.addEventListener('click',update);
  inp.addEventListener('blur',close);
  inp.addEventListener('keydown',e=>{
    if(box.hidden||!items.length)return;
    const stop=()=>{e.preventDefault();e.stopImmediatePropagation()};
    if(e.key==='ArrowDown'){stop();idx=(idx+1)%items.length;paint()}
    else if(e.key==='ArrowUp'){stop();idx=(idx-1+items.length)%items.length;paint()}
    else if(e.key==='Tab'||e.key==='Enter'){stop();accept(idx)}
    else if(e.key==='Escape')(stop(),close());
  });
  box.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d&&document.activeElement===inp)accept(+d.dataset.i)});
}

  ['mini','Mini calendar','--fs-mini',10,22,12.5],['head','Month buttons','--fs-head',10,22,13],['pill','Tag pills','--fs-pill',10,24,15],['day','Daily to-do','--fs-day',10,28,16]];
const COLS=[['bg','Background','--bg'],['card','Cards','--card'],['ink','Text','--ink'],['accent','Accent','--accent'],['today','Today / overdue','--today'],['day','Daily to-do','--day-bg']];
const mixW=(hex,t)=>'#'+[1,3,5].map(k=>Math.round(255-(255-parseInt(hex.substr(k,2),16))*t).toString(16).padStart(2,'0')).join('');   // blend toward white
const CLASSIC=[['Ivory',{bg:'#fbf9f2',card:'#fffefb',ink:'#2b2622',accent:'#f7b5cc',today:'#e26d5a'}],['White',{bg:'#ffffff',card:'#fffefb',ink:'#2b2622',accent:'#f7b5cc',today:'#e26d5a'}],
  ['Dark',{bg:'#1d1a17',card:'#26221e',ink:'#f0e9de',accent:'#f7b5cc',today:'#ee7f6c'}]];
const PRESETS=[...CLASSIC,...COLORS.map((c,i)=>[PASTEL_NAMES[i],{bg:mixW(c,.16),card:mixW(c,.05),ink:'#2b2622',accent:c,today:'#e26d5a'}])];
/* uploaded fonts: kept in IndexedDB on this device only (too big for localStorage, and not part of Backup) */
const MAXFONTS=5, uploaded=[], faces=new Map();
const fdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('planner-fonts',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('fonts',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const fstore=async mode=>(await fdb()).transaction('fonts',mode).objectStore('fonts');
const freq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function registerFont(rec){
  const ff=new FontFace(rec.name,rec.buf);await ff.load();document.fonts.add(ff);faces.set(rec.name,ff);
  if(!uploaded.includes(rec.name))uploaded.push(rec.name);
}
async function loadUploadedFonts(){
  try{for(const r of await freq((await fstore('readonly')).getAll()))try{await registerFont(r)}catch(e){}}catch(e){}
  applySettings();if(!$('#settings').hidden)buildSettings();
}
async function addFontFile(file){
  const st=db.settings;
  if(!/\.(ttf|otf|woff2?)$/i.test(file.name))return toast('Use a .ttf, .otf, .woff or .woff2 file');
  if(file.size>25e6)return toast('That font file is too large (max 25 MB)');
  if(uploaded.length>=MAXFONTS)return toast(`You can keep up to ${MAXFONTS} fonts — remove one first`);
  const name='★ '+file.name.replace(/\.[^.]+$/,'').replace(/["\\]/g,'').trim().slice(0,30);
  try{
    const rec={name,buf:await file.arrayBuffer()};
    await registerFont(rec);
    try{await freq((await fstore('readwrite')).put(rec))}catch(e){toast('Applied, but it could not be saved on this device')}
    st.font=name;applySettings();save();buildSettings();
  }catch(e){toast('Could not read that font file')}
}
async function removeFont(name){
  try{await freq((await fstore('readwrite')).delete(name))}catch(e){}
  const ff=faces.get(name);if(ff)document.fonts.delete(ff);faces.delete(name);
  uploaded.splice(uploaded.indexOf(name),1);
  const st=db.settings;if(st.font===name)st.font='';if(st.fontHead===name)st.fontHead='';
  applySettings();save();buildSettings();
}
function applySettings(){
  const st=db.settings,r=document.documentElement.style,c=st.colors;
  const set=(k,v)=>v?r.setProperty(k,v):r.removeProperty(k);
  set('--font',st.font&&fontCss(st.font));set('--font-head',st.fontHead&&fontCss(st.fontHead));
  SIZES.forEach(([k,,v])=>set(v,st.sizes[k]&&st.sizes[k]+'px'));
  COLS.forEach(([k,,v])=>set(v,c[k]));
  set('--line',(c.ink||c.card)&&'color-mix(in srgb,var(--ink) 12%,var(--card))');
  set('--muted',(c.ink||c.card)&&'color-mix(in srgb,var(--ink) 52%,var(--card))');
  set('--accent-soft',(c.accent||c.card)&&'color-mix(in srgb,var(--accent) 18%,var(--card))');
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=c.bg||'#ffffff';
  setHourHeight();
}
function buildSettings(){
  const st=db.settings,cs=getComputedStyle(document.documentElement);
  const hex=v=>{const x=cs.getPropertyValue(v).trim();return /^#[0-9a-f]{6}$/i.test(x)?x:'#000000'};
  const opt=sel=>FONTS.map(([n,t])=>`<option value="${n}" ${n===sel?'selected':''}>${n}</option>`).join('')+(uploaded.length?`<optgroup label="My fonts">${uploaded.map(n=>`<option value="${esc(n)}" ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</optgroup>`:'');
  $('#settings').innerHTML=`<header><b>Settings</b><button id="sClose" aria-label="Close">×</button></header><div class="body">
    <h4>Fonts</h4>
    <div class="row2"><label>Main font</label><select id="sFont">${opt(st.font||'Gaegu')}</select></div>
    <div class="row2"><label>Titles &amp; date</label><select id="sFontHead"><option value="">Same as main</option>${opt(st.fontHead)}</select></div>
    <div class="sample" id="sSample">23 October · 이번 주 할 일 Weekly</div>
    <div class="row2 upl"><button type="button" id="sUp">Upload font…</button><input type="file" id="sUpFile" accept=".ttf,.otf,.woff,.woff2" hidden><span class="hint">${uploaded.length}/${MAXFONTS} · saved only in this browser</span></div>
    ${uploaded.map(n=>`<div class="myfont"><span style="font-family:'${esc(n)}',sans-serif">${esc(n)}</span><button type="button" data-del="${esc(n)}" aria-label="Remove font">×</button></div>`).join('')}
    <h4>Font sizes (px)</h4>
    ${SIZES.map(([k,l,v,mn,mx,d])=>`<div class="row2"><label for="z_${k}">${l}</label><input type="range" id="z_${k}" data-k="${k}" min="${mn}" max="${mx}" step="0.5" value="${st.sizes[k]||d}"><output>${st.sizes[k]||d}</output></div>`).join('')}
    <div class="row2"><label for="z_hours">Hours shown</label><input type="range" id="z_hours" min="4" max="24" step="1" value="${st.hours||10}"><output>${st.hours||10}</output></div>
    <div class="row2"><label for="z_start">Start hour</label><input type="range" id="z_start" min="0" max="23" step="1" value="${st.startHour??8}"><output>${st.startHour??8}</output></div>
    <h4>Colours</h4>
    <div class="presets">${CLASSIC.map(([n,p])=>`<button data-p="${n}"><i style="background:linear-gradient(135deg,${p.bg} 50%,${p.accent} 50%)"></i>${n}</button>`).join('')}</div>
    <div class="swatches">${PRESETS.slice(CLASSIC.length).map(([n,p])=>`<button data-p="${n}" title="${n}" style="background:linear-gradient(135deg,${p.bg} 45%,${p.accent} 45%)"></button>`).join('')}</div>
    ${COLS.map(([k,l,v])=>`<div class="row2"><label for="c_${k}">${l}</label><input type="color" id="c_${k}" data-k="${k}" value="${st.colors[k]||hex(v)}"></div>`).join('')}
  </div><footer><span>Saved automatically</span><button id="sReset">Reset all</button></footer>`;
  const sample=()=>{$('#sSample').style.fontFamily=`${fontCss(st.fontHead||st.font||'Gaegu')},sans-serif`};sample();
  $('#sClose').onclick=()=>toggleSettings(false);
  $('#sFont').onchange=e=>{st.font=e.target.value==='Gaegu'?'':e.target.value;applySettings();save();sample()};
  $('#sUp').onclick=()=>$('#sUpFile').click();
  $('#sUpFile').onchange=e=>{const f=e.target.files[0];if(f)addFontFile(f)};
  $('#settings').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Remove this font from this browser?'))removeFont(b.dataset.del)});
  $('#sFontHead').onchange=e=>{st.fontHead=e.target.value;applySettings();save();sample()};
  $('#settings').querySelectorAll('input[type=range][data-k]').forEach(el=>el.oninput=()=>{
    const d=SIZES.find(x=>x[0]===el.dataset.k)[5];el.nextElementSibling.textContent=el.value;
    if(+el.value===d)delete st.sizes[el.dataset.k];else st.sizes[el.dataset.k]=+el.value;applySettings();save()});
  $('#z_start').oninput=e=>{e.target.nextElementSibling.textContent=e.target.value;st.startHour=+e.target.value;save();scrollToDefault()};
  $('#z_hours').oninput=e=>{e.target.nextElementSibling.textContent=e.target.value;st.hours=+e.target.value;applySettings();save()};
  $('#settings').querySelectorAll('input[type=color]').forEach(el=>el.oninput=()=>{st.colors[el.dataset.k]=el.value;applySettings();save()});
  $('#settings').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.colors={...PRESETS.find(x=>x[0]===b.dataset.p)[1]};applySettings();save();buildSettings()});
  $('#sReset').onclick=()=>{if(confirm('Reset fonts, sizes and colours to default?')){db.settings={sizes:{},colors:{}};applySettings();save();buildSettings()}};
}
function toggleSettings(on){
  const p=$('#settings');on=on===undefined?p.hidden:on;
  if(on)buildSettings();p.hidden=!on;
}
$('#gear').onclick=()=>toggleSettings();
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#settings').hidden&&!$('#dlg').open&&!/INPUT|SELECT/.test(document.activeElement.tagName))toggleSettings(false)});

/* ---- tag colour popup: click a tag pill; picking a colour another tag uses swaps the two ---- */
const cpop=document.createElement('div');cpop.className='cpop';cpop.hidden=true;document.body.appendChild(cpop);
function setTagColor(tag,color){
  const old=tagColor(tag),other=db.tags.find(t=>t!==tag&&tagColor(t)===color);
  db.tagColors[tag]=color;if(other)db.tagColors[other]=old;
  save();renderAll(true);renderTags();return other;
}
function openTagColor(pill){
  const tag=pill.dataset.t||pill.textContent.trim();if(!tag)return;
  const r=pill.getBoundingClientRect(),cur=tagColor(tag);
  cpop.innerHTML=`<small>#${esc(tag)}</small><div>`+palette().map(c=>`<button data-c="${c}" data-sw="${c}" style="--c:${c}" class="${c===cur?'on':''}" aria-label="${c}"></button>`).join('')
    +`<label class="pickc" title="Pick any colour"><input type="color" value="#ffffff"></label></div><p class="cmore"><button type="button" class="cedit">${colorEdit?'Done':'Edit colours'}</button></p>`;
  cpop.classList.toggle('editing',colorEdit);cpop._pill=pill;swatchSort(cpop.querySelector('div'));
  cpop.dataset.tag=tag;cpop.hidden=false;
  const w=cpop.offsetWidth,h=cpop.offsetHeight;
  let x=r.left-w-8;if(x<8)x=Math.min(r.right+8,innerWidth-w-8);   // beside the tag; left side first (tags sit at the right edge)
  cpop.style.left=x+'px';cpop.style.top=Math.max(8,Math.min(r.top+r.height/2-h/2,innerHeight-h-8))+'px';
  cpop.onclick=e=>{
    if(e.target.closest('.cedit')){colorEdit=!colorEdit;return openTagColor(cpop._pill)}
    const b=e.target.closest('[data-c]');if(!b)return;
    if(colorEdit){if(deleteColor(b.dataset.c))openTagColor(cpop._pill);return}
    const other=setTagColor(tag,b.dataset.c);cpop.hidden=true;if(other)toast(`Swapped colours with #${other}`)};
}
document.addEventListener('click',e=>{
  const pill=e.target.closest('.item .pill,.tagbar .pill');
  if(pill){e.stopPropagation();openTagColor(pill);return}
  if(!e.target.closest('.cpop'))cpop.hidden=true;
},true);
cpop.addEventListener('change',e=>{
  if(e.target.type!=='color'||!cpop.dataset.tag)return;
  rememberColor(e.target.value);const other=setTagColor(cpop.dataset.tag,e.target.value);cpop.hidden=true;if(other)toast(`Swapped colours with #${other}`)});
addEventListener('keydown',e=>{if(e.key==='Escape')cpop.hidden=true});
$('#weekList').addEventListener('scroll',()=>cpop.hidden=true);

/* ---- main ---- */
// unfinished weekly todos from past weeks roll forward to the current week
function carryOver(){
  const cur=iso(wkStart(today));let n=0;
  db.todos.forEach(t=>{if(t.scope==='week'&&!t.done&&t.key<cur){t.origin=t.origin||t.key;t.key=cur;n++}});
  if(n)save();return n;
}
function renderAll(keepScroll){renderHead();renderMini();renderWeek();renderTodos()}
carryOver();
applySettings();
renderAll();
loadUploadedFonts();
const initView=()=>{setHourHeight();scrollToDefault()};
initView();addEventListener('load',()=>requestAnimationFrame(initView));
if(document.fonts)document.fonts.ready.then(initView);   // fonts change row metrics; start at the chosen hour
addEventListener('resize',setHourHeight);
setInterval(()=>{if(drag)return;today.setTime(Date.now());const moved=carryOver();renderWeek();renderMini();if(moved)renderTodos()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
